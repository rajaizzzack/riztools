<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e6e9ed;--ac:#0f766e;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--in:#f3f4f6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1317;--card:#181d24;--tx:#e8eaed;--mut:#98a2b0;--bd:#2a313b;--ac:#2dd4bf;--ok:#4ade80;--okbg:#14532d;--bad:#f87171;--badbg:#4a1212;--in:#12161b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1317;--card:#181d24;--tx:#e8eaed;--mut:#98a2b0;--bd:#2a313b;--ac:#2dd4bf;--ok:#4ade80;--okbg:#14532d;--bad:#f87171;--badbg:#4a1212;--in:#12161b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:14px}
[hidden]{display:none!important}
h1{font-size:20px;margin:0}h3{font-size:14px;margin:18px 0 8px;color:var(--mut)}
.top,.row,.hd{display:flex;gap:8px;align-items:center}.top{margin-bottom:12px}.hd{justify-content:space-between;margin-bottom:8px}.row{flex-wrap:wrap;margin:10px 0}
.grow{flex:1}.mut{color:var(--mut);font-size:12px}.big{font-size:26px}
.card{background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
input,textarea{font:inherit;color:var(--tx);background:var(--in);border:0;border-radius:8px;padding:7px 9px;min-width:0}
input[type=number]{width:92px}textarea{width:100%}
input:focus,textarea:focus{outline:2px solid var(--ac)}
button{font:inherit;cursor:pointer;border:0;background:var(--in);color:var(--tx);border-radius:10px;padding:8px 12px;transition:transform .12s}
button:active{transform:scale(.94)}
button.pri{background:var(--ac);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#04201d}}
button.ghost{background:transparent}
.rbtn{background:var(--badbg);color:var(--bad);font-weight:700}
.rov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.rbox{background:var(--card);color:var(--tx);border-radius:16px;max-width:420px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4);max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.rbox h2{margin:0 0 6px;font-size:18px}.rbox ul{margin:8px 0;padding-left:20px}.rbox li{margin:2px 0}

const nextYM = y => { let a = y.split("-").map(Number), m = a[1] + 1, yr = a[0]; if (m > 12) { m = 1; yr++; } return yr + "-" + String(m).padStart(2, "0"); };
const mShift = (ym, n) => { const a = ym.split("-").map(Number), x = new Date(a[0], a[1] - 1 + n, 1); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0"); };

}

  const step = (n, h, d) => `<li><span class="stn">${n}</span><div><b>${h}</b>${d ? `<div class="mut">${d}</div>` : ""}</div></li>`;

const PGW = 595.28, PGH = 841.89, PGM = 40;

<script type="text/rz-app">
/* ===== Tool tambahan: Kenderaan, Hutang, Belanja, Langganan, Bajet + peringatan ===== */
const ZK = "riztool_z_v1", zE = id => document.getElementById(id);
const zd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const zmk = (o, day) => { const t = new Date(), dim = new Date(t.getFullYear(), t.getMonth() + o + 1, 0).getDate(); return zd(new Date(t.getFullYear(), t.getMonth() + o, Math.min(day, dim))); };

const znorm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

const zdef = () => ({ syncK: true, syncH: true, lic: "", kv: [zvnew("Kereta"), zvnew("Motor")], hut: [], bel: [],

const zarr = p => p ? p.split(".").reduce((o, k) => Array.isArray(o) ? o.find(x => x.id === k) : o && o[k], Z) : Z;
function zres(p) { const a = p.split("."), l = a.pop(), o = zarr(a.join(".")); return o ? [o, l] : null; }

/* ---- peringatan (guna juga untuk notifikasi APK) ---- */

  if (Z.lic) add("lic", "Lesen memandu tamat", Z.lic, 30, 14, "kend");
  Z.kv.forEach(v => {
    if (v.rt) add("rt" + v.id, v.name + ": road tax & insurans tamat", v.rt, 30, 14, "kend");
    const l = zOil(v); if (l != null && l <= 500) R.push({ id: "oil" + v.id + v.oilOdo, t: v.name + ": masa tukar minyak hitam" + (l < 0 ? " (lepas " + (-l) + " km)" : " (" + l + " km lagi)"), d: null, days: l < 0 ? -1 : 0, nb: 0, tool: "kend" });

/* ---- Hutang Member ---- */
const zRemain = h => Math.max(0, r2(h.amt - h.paid));
function zHutG() { const G = {}; Z.hut.forEach(h => { const k = znorm(h.name) || h.id; (G[k] = G[k] || { key: k, name: h.name, L: [] }).L.push(h); }); return Object.values(G).map(g => Object.assign(g, { o: r2(g.L.reduce((a, h) => a + zRemain(h), 0)) })).sort((a, b) => b.o - a.o); }

/* ---- Belanja Harian ---- */
const zBelM = m => Z.bel.filter(e => e.date.slice(0, 7) === m);

/* ---- Bajet Bulanan (sync dengan Sewa, Bil, Langganan, Belanja) ---- */
function zBajM(ym) {
  const B = Z.baj; if (!B.m) B.m = {};
  if (!B.m[ym]) { const ks = Object.keys(B.m).filter(k => k < ym).sort(), src = ks.length ? B.m[ks[ks.length - 1]] : { gaji: B.gaji || 0, extra: B.extra || [] };

    if (step === 3) h = head(4) + `<h2>Taip RESET</h2><div>Taip perkataan <b>RESET</b> (huruf besar) untuk sahkan.</div><input type="text" id="rtxt" autocomplete="off" autocapitalize="characters" placeholder="RESET"><div class="row" style="justify-content:flex-end">${cancel}<button class="pri" data-r="n" id="rnx" disabled>Teruskan</button></div>`;

/* ================= SKRIN LOGIN ================= */
function showLogin() {
  document.body.classList.add("rz-locked");
  const ov = document.createElement("div"); ov.className = "rzfull"; ov.id = "rzLogin"; document.body.appendChild(ov);
  let tab = "in", busy = false;
  const draw = (err) => {
    ov.innerHTML = `<div class="rzbox"><h2>🧰 RIZTOOLS</h2><div class="mut">Log masuk dulu untuk buka app.</div>
      <div class="rztabs"><button type="button" data-t="in" class="${tab === "in" ? "on" : ""}">Log masuk</button><button type="button" data-t="up" class="${tab === "up" ? "on" : ""}">Daftar</button></div>
      <form id="rzF" autocomplete="on">
        ${tab === "up" ? '<label for="rzN">Nama (untuk sapaan)</label><input id="rzN" type="text" maxlength="30" autocomplete="name">' : ""}
        <label for="rzU">Username</label><input id="rzU" type="text" autocapitalize="none" autocomplete="username" maxlength="20">
        <label for="rzP">Password</label><input id="rzP" type="password" autocomplete="${tab === "in" ? "current-password" : "new-password"}">
        ${tab === "up" ? '<label for="rzP2">Ulang password</label><input id="rzP2" type="password" autocomplete="new-password">' : ""}
        <div class="rzerr" id="rzE">${E(err || "")}</div>
        <button class="pri" style="width:100%" type="submit">${tab === "in" ? "Log masuk" : "Daftar & masuk"}</button>
      </form></div>`;
    const f = $("rzF"); (tab === "up" ? $("rzN") : $("rzU")).focus();
    f.onsubmit = async e => { e.preventDefault(); if (busy) return; busy = true; draw2(await (tab === "in" ? doLogin() : doReg())); busy = false; };
  };
  const draw2 = m => { if (m) { const el = $("rzE"); if (el) el.textContent = m; } };
  ov.addEventListener("click", e => { const t = e.target.closest("[data-t]"); if (t) { tab = t.dataset.t; draw(); } });
  async function doLogin() {
    const un = $("rzU").value.trim().toLowerCase(), pw = $("rzP").value;
    let L = {}; try { L = JSON.parse(raw.get(LK)) || {}; } catch (e) {}
    if (L.until && Date.now() < L.until) return "Terlalu banyak cuba salah. Tunggu " + Math.ceil((L.until - Date.now()) / 1000) + " saat.";
    const u = users().find(x => x.username === un); let ok = false;
    if (u) ok = (await hashPw(pw, u.salt)) === u.hash; else await hashPw(pw, "x");
    if (!ok) { L.n = (L.n || 0) + 1; if (L.n >= 5) { L.until = Date.now() + 30000; L.n = 0; } raw.set(LK, JSON.stringify(L)); return "Username atau password salah."; }
    raw.del(LK); raw.set(SK, u.id); location.reload(); return "";
  }
  async function doReg() {
    const nm = $("rzN").value.trim(), un = $("rzU").value.trim().toLowerCase(), pw = $("rzP").value;
    if (pw !== $("rzP2").value) return "Password tak sama.";
    const er = checkUser(un, nm, pw); if (er) return er;
    const u = await mkUser(un, nm, pw); raw.set(SK, u.id); location.reload(); return "";
  }
  draw();
}

/* ================= BILA DAH LOGIN ================= */
function boot() {
  const pre = CU.root ? "" : "rzu_" + CU.id + "__", mk = k => String(k).indexOf("rzauth_") === 0 ? k : pre + k;
  if (pre) {
    Sp.getItem = function (k) { return this === localStorage ? rg.call(this, mk(k)) : rg.call(this, k); };
    Sp.setItem = function (k, v) { return this === localStorage ? rs.call(this, mk(k), v) : rs.call(this, k, v); };
    Sp.removeItem = function (k) { return this === localStorage ? rd.call(this, mk(k)) : rd.call(this, k); };
    const io = IDBFactory.prototype.open;
    IDBFactory.prototype.open = function (n, v) { return v === undefined ? io.call(this, pre + n) : io.call(this, pre + n, v); };
  }
  window.RZwipe = function () {
    Object.keys(localStorage).forEach(k => { if (pre ? k.indexOf(pre) === 0 : (k.indexOf("riztool_") === 0 || k.indexOf("sewa_") === 0)) raw.del(k); });
  };
  document.body.classList.remove("rz-locked");
  window.RZ_ADMIN = !!CU.root;

  const top = document.querySelector("main > .top"), g = document.createElement("div");
  g.id = "rzGreet"; g.className = "card"; top.after(g);
  window.__rzPanel = panel;
  const paint = () => {
    const u = cur() || CU;
    const sig = (u.av ? u.av.t + (u.av.e || "") + (u.av.c || "") + (u.av.d ? u.av.d.length : "") : "") + u.name + (u.pangkat || "") + wish();
    if (g.dataset.sig !== sig) { g.dataset.sig = sig;
    g.innerHTML = `<div class="gwrap"><span data-act="nav_profile" role="button" aria-label="Profil">${avHTML(u, 56)}</span><div style="flex:1;min-width:0"><div class="g1"><span class="gw">${wish()},</span><span class="gn"><b>${E(u.name)}</b> <i class="wv">👋</i></span></div><div class="mut" style="margin-top:4px"><span class="rzb ${u.root ? "adm" : ""}">${E(u.pangkat || "USER")}</span> · @${E(u.username)}</div></div></div>`; }
    const nb = document.getElementById("navAv"); if (nb) nb.innerHTML = avHTML(u, 23);
    g.hidden = location.hash.slice(1) !== "";
  };
  paint(); addEventListener("hashchange", paint); setInterval(paint, 60000);
  window.__rzPaint = paint;

  document.querySelectorAll('script[type="text/rz-app"]').forEach(s => { const n = document.createElement("script"); n.textContent = s.textContent; document.body.appendChild(n); });
  try { if (typeof route === "function") route(); } catch (e) {}
}

/* ================= PANEL AKAUN ================= */
function panel(msg, good) {
  let ov = $("rzPanel");
  if (!ov) { ov = document.createElement("div"); ov.className = "rov"; ov.id = "rzPanel"; AVDR = null; AVM = ""; PSEC = {}; document.body.appendChild(ov); ov.addEventListener("click", onClick);
    ov.addEventListener("toggle", e => { const d = e.target; if (d && d.dataset && d.dataset.s) PSEC[d.dataset.s] = d.open; }, true);
    ov.addEventListener("change", async e => { if (e.target.id !== "avF" || !e.target.files[0]) return; try { const d = await avCrop(e.target.files[0]); e.target.value = ""; if (!d) return; AVDR = { t: "img", d }; AVM = ""; panel(); } catch (er) { panel("Gambar tak dapat dibaca. Cuba gambar lain."); } }); }
  const me = cur(); if (!me) return logout();
  const st = ov.firstElementChild ? ov.firstElementChild.scrollTop : 0, cav = AVDR ? (AVDR.t === "none" ? null : AVDR) : me.av, meV = Object.assign({}, me, { av: cav }), fg = cav && cav.t === "fig" ? Object.assign({}, AVD, cav) : AVD, O = (lb, k, L) => { const sw = typeof L[0] === "string" && L[0][0] === "#"; return `<div class="mut">${lb}</div><div class="opt ${sw ? "sw" : ""}">${L.map((x, i) => `<button data-z="avf" data-k="${k}" data-v="${i}" class="${fg[k] === i ? "on" : ""}" ${sw ? `style="background:${x}" aria-label="${lb} ${i + 1}"` : ""}>${sw ? "" : x}</button>`).join("")}</div>`; };
  const op = k => (PSEC[k] ? "open" : "");
  let adm = "";
  if (me.root) {
    const list = users().filter(u => u.id !== me.id).map(u => `<div class="rzu"><div><b>${E(u.name)}</b> <span class="mut">@${E(u.username)}</span></div>
      <div class="row"><input type="text" id="pk_${u.id}" value="${E(u.pangkat || "USER")}" maxlength="16" style="flex:1;margin:0"><button data-z="pk" data-id="${u.id}">Simpan pangkat</button></div>
      <div class="row"><button data-z="rp" data-id="${u.id}">🔑 Reset password</button><button class="del" data-z="dl" data-id="${u.id}">🗑️ Padam</button></div></div>`).join("") || '<div class="mut">Belum ada pengguna lain.</div>';
    const nUsr = users().filter(u => u.id !== me.id).length;
    adm = `<details class="acc" data-s="us" ${op("us")}><summary>👥 Urus pengguna <span class="cnt">${nUsr}</span></summary><div class="accb">${list}
      <div class="mut" style="margin-top:12px">Tambah pengguna baru</div><input type="text" id="auN" placeholder="Nama"><input type="text" id="auU" placeholder="username" autocapitalize="none"><input type="text" id="auP" placeholder="password (min 6)" autocomplete="off"><button class="pri" data-z="au">Tambah</button></div></details>`;
  }
  ov.innerHTML = `<div class="rzbox pn"><div class="grab"></div><div class="phd"><h2>Profil</h2><button class="pri" data-z="x">✕ Tutup</button></div>
    <div class="phero">${avHTML(me, 72)}<div class="grow" style="min-width:0"><div class="pn1">${E(me.name)}</div><div><span class="rzb ${me.root ? "adm" : ""}">${E(me.pangkat || "USER")}</span> <span class="mut">@${E(me.username)}</span></div></div></div>
    <div class="${good ? "rzok" : "rzerr"}" id="rzM" style="margin-top:6px">${E(msg || "")}</div>
    <details class="acc" data-s="av" ${PSEC.av || AVDR ? "open" : ""}><summary>🎨 Avatar</summary><div class="accb"><div class="row" style="margin:0 0 10px;gap:14px;flex-wrap:nowrap;align-items:flex-start">${cav && cav.t === "fig" ? `<span class="avbody" style="width:96px;height:134px;background:${AVB[fg.bg]}">${avSvg(fg, true)}</span>` : avHTML(meV, 96)}<div class="grow"><div class="mut" style="margin-bottom:8px">Reka watak sendiri, atau guna gambar dari phone.</div><div class="row" style="margin:0"><button data-z="avU">📷 Gambar sendiri</button><button data-z="avRnd">🎲 Rawak</button>${cav ? '<button class="del" data-z="avR">Reset</button>' : ""}</div></div></div>
    <input type="file" id="avF" accept="image/*" hidden>
    ${O("Kulit", "sk", AVS)}${O("Gaya rambut", "hs", ["Pendek", "Belah tepi", "Panjang", "Kerinting", "Sanggul", "Botak"])}${O("Warna rambut", "hc", AVH)}${O("Penutup kepala", "hw", ["Tiada", "Cap", "Beanie", "Tudung", "Songkok"])}${fg.hw > 0 && fg.hw < 4 ? O("Warna penutup", "wc", AVT) : ""}${O("Cermin mata", "gl", ["Tiada", "Bulat", "Segi", "Gelap"])}${O("Headphone", "hp", ["Tiada", "Ada"])}${O("Baju", "ts", ["T-shirt", "Hoodie", "Kemeja"])}${O("Warna baju", "tc", AVT)}${O("Seluar", "ps", ["Panjang", "Pendek"])}${O("Warna seluar", "pc", AVP)}${O("Latar", "bg", AVB)}<div class="avsave"><span class="mut" style="flex:1">${AVDR ? "Ada perubahan belum disimpan" : E(AVM)}</span>${AVDR ? '<button data-z="avCx">Batal</button>' : ""}<button class="pri" data-z="avS">💾 Simpan profil</button></div></div></details>
    <details class="acc" data-s="ak" ${op("ak")}><summary>🔐 Nama & password</summary><div class="accb"><div class="mut">Tukar nama</div><div class="row" style="margin-top:4px"><input type="text" id="mNm" value="${E(me.name)}" maxlength="30" style="flex:1;margin:0"><button data-z="nm">Simpan</button></div>
      <div class="mut" style="margin-top:12px">Tukar password</div><input type="password" id="mO" placeholder="Password lama" autocomplete="current-password"><input type="password" id="mP" placeholder="Password baru (min 6)" autocomplete="new-password"><button data-z="pw">Tukar password</button></div></details>
    <details class="acc" data-s="in" ${op("in")}><summary>📲 Pasang di skrin utama</summary><div class="accb"><div class="mut" style="margin-bottom:8px">Jadikan RIZTOOLS ada ikon di phone, buka terus macam app.</div><button class="pri" data-z="inst" style="width:100%">Tengok cara (iPhone &amp; Android)</button></div></details>
    <details class="acc" data-s="bk" ${op("bk")}><summary>💾 Backup data</summary><div class="accb"><div class="mut" id="bkInfo"></div><div class="row"><button class="pri grow" data-z="bk">💾 Simpan ke peranti</button><button class="grow" data-z="bks">📤 Kongsi / hantar</button></div><div class="row" style="margin-top:0"><button class="grow" data-z="bkl">⬇️ Restore dari fail</button></div><div class="mut" id="bkMsg" style="min-height:20px"></div><div class="mut" style="margin-top:6px">Simpan ke peranti: di PC awak boleh pilih folder. Di phone, pilih Simpan ke Fail atau Drive dalam menu yang keluar. Kongsi: terus ke WhatsApp, emel atau Drive. Backup disimpan di luar app dan bukan di cloud (cloud akan datang). Termasuk semua tool dan gambar.</div></div></details>
    ${adm}
    <details class="acc danger" data-s="dz" ${op("dz")}><summary>⚠️ Zon bahaya</summary><div class="accb"><div class="mut" style="margin-bottom:8px">Padam semua data dalam app ni dan mula dari kosong. Perlu 5 kali pengesahan.</div><button class="rbtn" data-z="rst" style="width:100%">🗑️ Reset semua data</button></div></details>
</div>`;
  if (window.bkLabel) bkLabel();
  if (st) ov.firstElementChild.scrollTop = st;
}
async function onClick(e) {
  const t = e.target.closest("[data-z]"); if (!t) { if (e.target.id === "rzPanel") $("rzPanel").remove(); return; }
  const z = t.dataset.z, id = t.dataset.id, me = cur(); if (!me) return logout();
  const v = i => ($(i) ? $(i).value : "");
  if (z === "x") return $("rzPanel").remove();
  if (z === "out") return confirmLogout();
  if (z === "inst") return window.installSheet && installSheet();
  if (z === "bk") return window.bkAct("bk_save");
  if (z === "bks") return window.bkAct("bk_share");
  if (z === "bkl") return window.bkAct("bk_load");
  if (z === "rst") { $("rzPanel").remove(); return window.bkAct("bk_reset"); }
  if (z === "avU") return $("avF").click();
  if (z === "avf" || z === "avRnd") { const f = AVDR && AVDR.t === "fig" ? AVDR : (!AVDR && me.av && me.av.t === "fig" ? Object.assign({}, me.av) : Object.assign({ t: "fig" }, AVD));
    if (z === "avf") f[t.dataset.k] = +t.dataset.v; else { const r = n => Math.floor(Math.random() * n); Object.assign(f, { sk: r(6), hs: r(6), hc: r(7), hw: r(10) < 7 ? 0 : 1 + r(4), wc: r(10), gl: r(10) < 6 ? 0 : 1 + r(3), hp: r(10) < 8 ? 0 : 1, ts: r(3), tc: r(10), ps: r(2), pc: r(6), bg: r(10) }); }
    AVDR = f; AVM = ""; return panel(); }
  if (z === "avE" || z === "avC") { const a = users(), u = a.find(x => x.id === me.id), av = u.av && u.av.t === "emo" ? u.av : { t: "emo", e: "🙂", c: "#0d9488" }; if (z === "avE") av.e = t.dataset.v; else av.c = t.dataset.v; u.av = av; saveUsers(a); window.__rzPaint(); return panel(); }
  if (z === "avR") { AVDR = { t: "none" }; AVM = ""; return panel(); }
  if (z === "avCx") { AVDR = null; AVM = ""; return panel(); }
  if (z === "avS") { const a = users(), u = a.find(x => x.id === me.id); if (AVDR) { if (AVDR.t === "none") delete u.av; else u.av = AVDR; saveUsers(a); AVDR = null; window.__rzPaint(); } AVM = "Profil dah disimpan ✅"; return panel(); }
  if (z === "nm") { const n = v("mNm").trim(); if (n.length < 2 || n.length > 30) return panel("Nama 2-30 huruf."); const a = users(); a.find(u => u.id === me.id).name = n; saveUsers(a); window.__rzPaint(); return panel("Nama dah ditukar.", true); }
  if (z === "pw") {
    if ((await hashPw(v("mO"), me.salt)) !== me.hash) return panel("Password lama salah.");
    const np = v("mP"); if (np.length < 6 || np.length > 64) return panel("Password baru minimum 6 aksara.");
    const a = users(), u = a.find(x => x.id === me.id); u.salt = uid(); u.hash = await hashPw(np, u.salt); saveUsers(a); return panel("Password dah ditukar.", true);
  }
  if (!me.root) return;
  if (z === "au") {
    const nm = v("auN").trim(), un = v("auU").trim().toLowerCase(), pw = v("auP"), er = checkUser(un, nm, pw); if (er) return panel(er);
    await mkUser(un, nm, pw); return panel("Pengguna " + un + " ditambah.", true);
  }
  const a = users(), u = a.find(x => x.id === id); if (!u || u.root) return;
  if (z === "pk") {
    const p = v("pk_" + id).trim().toUpperCase(); if (!p) return panel("Pangkat tak boleh kosong.");
    if (p === "ADMIN") return panel("Pangkat ADMIN hanya untuk kau seorang.");
    u.pangkat = p.slice(0, 16); saveUsers(a); return panel("Pangkat " + u.username + " jadi " + u.pangkat + ".", true);
  }
  if (z === "rp") {
    const np = prompt("Password baru untuk @" + u.username + " (min 6 aksara):"); if (np === null) return;
    if (np.length < 6 || np.length > 64) return panel("Password minimum 6 aksara.");
    u.salt = uid(); u.hash = await hashPw(np, u.salt); saveUsers(a); return panel("Password @" + u.username + " dah direset.", true);
  }
  if (z === "dl") {
    if (!confirm("Padam @" + u.username + " dan SEMUA data dia di peranti ni? Tak boleh undo.")) return;
    const p = "rzu_" + u.id + "__";
    Object.keys(localStorage).forEach(k => { if (k.indexOf(p) === 0) raw.del(k); });
    try { indexedDB.deleteDatabase(p + "riztool_claim"); } catch (er) {}
    saveUsers(a.filter(x => x.id !== id)); return panel("@" + u.username + " dah dipadam.", true);
  }
}

if (CU) boot(); else seed().then(showLogin);
})();

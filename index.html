<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e6e9ed;--ac:#0f766e;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--in:#f3f4f6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1317;--card:#181d24;--tx:#e8eaed;--mut:#98a2b0;--bd:#2a313b;--ac:#2dd4bf;--ok:#4ade80;--okbg:#14532d;--bad:#f87171;--badbg:#4a1212;--in:#12161b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1317;--card:#181d24;--tx:#e8eaed;--mut:#98a2b0;--bd:#2a313b;--ac:#2dd4bf;--ok:#4ade80;--okbg:#14532d;--bad:#f87171;--badbg:#4a1212;--in:#12161b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:14px}
[hidden]{display:none!important}
h1{font-size:20px;margin:0}h3{font-size:14px;margin:18px 0 8px;color:var(--mut)}
.top,.row,.hd{display:flex;gap:8px;align-items:center}.top{margin-bottom:12px}.hd{justify-content:space-between;margin-bottom:8px}.row{flex-wrap:wrap;margin:10px 0}
.grow{flex:1}.mut{color:var(--mut);font-size:12px}.big{font-size:26px}
.card{background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
input,textarea{font:inherit;color:var(--tx);background:var(--in);border:0;border-radius:8px;padding:7px 9px;min-width:0}
input[type=number]{width:92px}textarea{width:100%}
input:focus,textarea:focus{outline:2px solid var(--ac)}
button{font:inherit;cursor:pointer;border:0;background:var(--in);color:var(--tx);border-radius:10px;padding:8px 12px;transition:transform .12s}
button:active{transform:scale(.94)}
button.pri{background:var(--ac);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#04201d}}
button.ghost{background:transparent}
.rbtn{background:var(--badbg);color:var(--bad);font-weight:700}
.rov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.rbox{background:var(--card);color:var(--tx);border-radius:16px;max-width:420px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4);max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.rbox h2{margin:0 0 6px;font-size:18px}.rbox ul{margin:8px 0;padding-left:20px}.rbox li{margin:2px 0}
.rstep{font-size:12px;color:var(--mut);margin-bottom:6px}.rbar{height:5px;background:var(--in);border-radius:5px;margin-bottom:12px;overflow:hidden}.rbar i{display:block;height:100%;background:var(--bad);transition:width .25s}
.rbox input[type=text]{width:100%;margin:8px 0;text-align:center;font-weight:700;letter-spacing:2px}
.rbox label{display:flex;gap:8px;align-items:flex-start;margin:10px 0}
.rbox button:disabled{opacity:.4;cursor:not-allowed}button.del{color:var(--bad)}
.tool{text-align:left;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06);padding:14px}
.mon{font-size:18px;font-weight:700}
.bar{height:8px;border-radius:9px;background:var(--in);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .6s}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:4px;width:100%}
th{font-weight:500;text-align:center;vertical-align:bottom;padding:0 2px 4px}
th .bn{font-size:12px}td{text-align:center}
td.pn{text-align:left;font-weight:600;position:sticky;left:0;background:var(--card);padding-right:6px}
.ic{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px}.ic svg{width:20px;height:20px}
.cell{width:100%;min-width:64px;font-weight:600;padding:9px 2px}
.cell.on{background:var(--okbg);color:var(--ok)}.cell.off{background:var(--badbg);color:var(--bad)}
.cell.part{background:#fde68a;color:#78350f}.ics{display:flex;gap:2px;justify-content:center;margin-bottom:2px}.ics .ic{width:26px;height:26px;border-radius:8px}.ics .ic svg{width:15px;height:15px}
.na{color:var(--mut)}.owe{font-weight:700;white-space:nowrap}.owe.z{color:var(--ok)}.owe.b{color:var(--bad)}
.r2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.r2 input:first-child{flex:1;min-width:100px}
.pr{display:flex;gap:8px;align-items:center;padding:3px 0}.pr span{flex:1}
.icb{padding:0;background:none}
.warn{color:var(--bad);font-size:12px}
details{margin-top:6px}summary{color:var(--mut);cursor:pointer;font-size:13px}
#wa{min-height:240px;font:12px ui-monospace,Menlo,Consolas,monospace;margin-top:6px}
.pop-in{animation:pin .4s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pin{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.glow{animation:glow 1.6s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--ok)}40%{box-shadow:0 0 18px var(--ok)}100%{box-shadow:none}}
.cell.bump{animation:bump .4s}
@keyframes bump{0%{transform:scale(.8)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.conf{position:fixed;z-index:99;pointer-events:none;font-size:20px;animation:conf 1s ease-out forwards}
@keyframes conf{from{transform:translate(-50%,-50%) scale(.5);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 50px)) scale(1.2) rotate(240deg);opacity:0}}
.hrow{display:flex;gap:10px;align-items:center;padding:6px 0}.hrow .nm{flex:1;font-weight:600}.hrow .cell{width:auto;min-width:112px;padding:9px 10px}
.hrow.done .nm{color:var(--mut)}.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}.sum .mut{font-size:12px}.sum b{font-size:17px}

const ymLabel = y => { const a = y.split("-"); return MN[a[1] - 1] + " " + a[0]; };
const nowYM = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const nextYM = y => { let a = y.split("-").map(Number), m = a[1] + 1, yr = a[0]; if (m > 12) { m = 1; yr++; } return yr + "-" + String(m).padStart(2, "0"); };
const mShift = (ym, n) => { const a = ym.split("-").map(Number), x = new Date(a[0], a[1] - 1 + n, 1); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0"); };

function todaySheet() {

/* sound */
const NOTES = { pay: [[660, .12, 0], [880, .18, .08]], low: [[330, .12, 0], [247, .18, .08]], tick: [[520, .06, 0]], pop: [[500, .08, 0], [750, .1, .06]], chime: [[523, .2, 0], [659, .2, .09], [784, .3, .18]], fan: [[523, .18, 0], [659, .18, .12], [784, .18, .24], [1047, .45, .36], [1319, .4, .5]] };
function sfx(k) {
  if (!SND) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    (NOTES[k] || []).forEach(n => {
      const t = AC.currentTime + n[2], o = AC.createOscillator(), g = AC.createGain();
      o.type = k === "low" ? "triangle" : "sine"; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + n[1]);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + n[1] + .02);

}

}

    <details class="acc" data-s="av" ${PSEC.av || AVDR ? "open" : ""}><summary>🎨 Avatar</summary><div class="accb"><div class="row" style="margin:0 0 10px;gap:14px;flex-wrap:nowrap;align-items:flex-start">${cav && cav.t === "fig" ? `<span class="avbody" style="width:96px;height:134px;background:${AVB[fg.bg]}">${avSvg(fg, true)}</span>` : avHTML(meV, 96)}<div class="grow"><div class="mut" style="margin-bottom:8px">Reka watak sendiri, atau guna gambar dari phone.</div><div class="row" style="margin:0"><button data-z="avU">📷 Gambar sendiri</button><button data-z="avRnd">🎲 Rawak</button>${cav ? '<button class="del" data-z="avR">Reset</button>' : ""}</div></div></div>
    <input type="file" id="avF" accept="image/*" hidden>
    ${O("Kulit", "sk", AVS)}${O("Gaya rambut", "hs", ["Pendek", "Belah tepi", "Panjang", "Kerinting", "Sanggul", "Botak"])}${O("Warna rambut", "hc", AVH)}${O("Penutup kepala", "hw", ["Tiada", "Cap", "Beanie", "Tudung", "Songkok"])}${fg.hw > 0 && fg.hw < 4 ? O("Warna penutup", "wc", AVT) : ""}${O("Cermin mata", "gl", ["Tiada", "Bulat", "Segi", "Gelap"])}${O("Headphone", "hp", ["Tiada", "Ada"])}${O("Baju", "ts", ["T-shirt", "Hoodie", "Kemeja"])}${O("Warna baju", "tc", AVT)}${O("Seluar", "ps", ["Panjang", "Pendek"])}${O("Warna seluar", "pc", AVP)}${O("Latar", "bg", AVB)}<div class="avsave"><span class="mut" style="flex:1">${AVDR ? "Ada perubahan belum disimpan" : E(AVM)}</span>${AVDR ? '<button data-z="avCx">Batal</button>' : ""}<button class="pri" data-z="avS">💾 Simpan profil</button></div></div></details>

async function onClick(e) {
  const t = e.target.closest("[data-z]"); if (!t) { if (e.target.id === "rzPanel") $("rzPanel").remove(); return; }
  const z = t.dataset.z, id = t.dataset.id, me = cur(); if (!me) return logout();
  const v = i => ($(i) ? $(i).value : "");
  if (z === "x") return $("rzPanel").remove();
  if (z === "out") return confirmLogout();
  if (z === "inst") return window.installSheet && installSheet();
  if (z === "bk") return window.bkAct("bk_save");
  if (z === "bks") return window.bkAct("bk_share");
  if (z === "bkl") return window.bkAct("bk_load");
  if (z === "rst") { $("rzPanel").remove(); return window.bkAct("bk_reset"); }
  if (z === "avU") return $("avF").click();
  if (z === "avf" || z === "avRnd") { const f = AVDR && AVDR.t === "fig" ? AVDR : (!AVDR && me.av && me.av.t === "fig" ? Object.assign({}, me.av) : Object.assign({ t: "fig" }, AVD));
    if (z === "avf") f[t.dataset.k] = +t.dataset.v; else { const r = n => Math.floor(Math.random() * n); Object.assign(f, { sk: r(6), hs: r(6), hc: r(7), hw: r(10) < 7 ? 0 : 1 + r(4), wc: r(10), gl: r(10) < 6 ? 0 : 1 + r(3), hp: r(10) < 8 ? 0 : 1, ts: r(3), tc: r(10), ps: r(2), pc: r(6), bg: r(10) }); }
    AVDR = f; AVM = ""; return panel(); }
  if (z === "avE" || z === "avC") { const a = users(), u = a.find(x => x.id === me.id), av = u.av && u.av.t === "emo" ? u.av : { t: "emo", e: "🙂", c: "#0d9488" }; if (z === "avE") av.e = t.dataset.v; else av.c = t.dataset.v; u.av = av; saveUsers(a); window.__rzPaint(); return panel(); }
  if (z === "avR") { AVDR = { t: "none" }; AVM = ""; return panel(); }
  if (z === "avCx") { AVDR = null; AVM = ""; return panel(); }
  if (z === "avS") { const a = users(), u = a.find(x => x.id === me.id); if (AVDR) { if (AVDR.t === "none") delete u.av; else u.av = AVDR; saveUsers(a); AVDR = null; window.__rzPaint(); } AVM = "Profil dah disimpan ✅"; return panel(); }
  if (z === "nm") { const n = v("mNm").trim(); if (n.length < 2 || n.length > 30) return panel("Nama 2-30 huruf."); const a = users(); a.find(u => u.id === me.id).name = n; saveUsers(a); window.__rzPaint(); return panel("Nama dah ditukar.", true); }
  if (z === "pw") {
    if ((await hashPw(v("mO"), me.salt)) !== me.hash) return panel("Password lama salah.");
    const np = v("mP"); if (np.length < 6 || np.length > 64) return panel("Password baru minimum 6 aksara.");
    const a = users(), u = a.find(x => x.id === me.id); u.salt = uid(); u.hash = await hashPw(np, u.salt); saveUsers(a); return panel("Password dah ditukar.", true);
  }
  if (!me.root) return;
  if (z === "au") {
    const nm = v("auN").trim(), un = v("auU").trim().toLowerCase(), pw = v("auP"), er = checkUser(un, nm, pw); if (er) return panel(er);
    await mkUser(un, nm, pw); return panel("Pengguna " + un + " ditambah.", true);
  }
  const a = users(), u = a.find(x => x.id === id); if (!u || u.root) return;
  if (z === "pk") {
    const p = v("pk_" + id).trim().toUpperCase(); if (!p) return panel("Pangkat tak boleh kosong.");
    if (p === "ADMIN") return panel("Pangkat ADMIN hanya untuk kau seorang.");
    u.pangkat = p.slice(0, 16); saveUsers(a); return panel("Pangkat " + u.username + " jadi " + u.pangkat + ".", true);
  }
  if (z === "rp") {
    const np = prompt("Password baru untuk @" + u.username + " (min 6 aksara):"); if (np === null) return;
    if (np.length < 6 || np.length > 64) return panel("Password minimum 6 aksara.");
    u.salt = uid(); u.hash = await hashPw(np, u.salt); saveUsers(a); return panel("Password @" + u.username + " dah direset.", true);
  }
  if (z === "dl") {
    if (!confirm("Padam @" + u.username + " dan SEMUA data dia di peranti ni? Tak boleh undo.")) return;
    const p = "rzu_" + u.id + "__";
    Object.keys(localStorage).forEach(k => { if (k.indexOf(p) === 0) raw.del(k); });
    try { indexedDB.deleteDatabase(p + "riztool_claim"); } catch (er) {}
    saveUsers(a.filter(x => x.id !== id)); return panel("@" + u.username + " dah dipadam.", true);
  }
}

if (CU) boot(); else seed().then(showLogin);
